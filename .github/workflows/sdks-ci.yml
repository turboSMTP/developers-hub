# Lint, typecheck, build and test the SDK packages.
#
# The rest of the repository is documentation and a generated spec bundle, covered
# by validate-openapi.yml, so this workflow is scoped to paths under sdks/.
name: SDKs CI

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Also run the live smoke tests (sends real email)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'biome.json'
      - '.github/workflows/sdks-ci.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'sdks/**'
      - 'biome.json'
      - '.github/workflows/sdks-ci.yml'
      - '.github/actions/**'

# Least privilege is declared here, at the calling workflow, and covers every job below.
# A composite action cannot declare `permissions` of its own, so moving a step into
# .github/actions/ does not move responsibility for its token scope — this block still
# owns it. Widen it per job only where a job demonstrably needs more.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/biome-check

  # Both ends of what the packages promise: `engines` says >=22, so 22 is the claim
  # under test and 24 is the active LTS consumers install today. The build toolchain
  # runs on both (typescript >=16.20, esbuild >=18), so no artifact hand-off is needed.
  # This verifies the source tree, not the tarball; ADR-0004 rule 4's artifact-based
  # check is still owed (ADR-0011 decision 3).
  test:
    name: Test ${{ matrix.package.name }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The path is carried per package rather than derived from the name: unified SDKs
        # live under sdks/packages/ and webhook receivers under sdks/webhooks/.
        package:
          - { name: node, path: sdks/packages/node }
          - { name: node-webhook, path: sdks/webhooks/node-webhook }
        node: [22, 24]
    defaults:
      run:
        working-directory: ${{ matrix.package.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-package
        with:
          path: ${{ matrix.package.path }}
          node-version: ${{ matrix.node }}
      # The gates themselves stay in the workflow rather than moving into the action:
      # what blocks a merge should be readable without opening a second file.
      - run: npm run typecheck
      - run: npm test

  examples:
    name: Typecheck examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/packages/node
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-package
        with:
          path: sdks/packages/node
      - run: npm run typecheck:examples

  # Sends real email, so it never runs automatically. GitHub does not expose secrets
  # to pull_request runs from a fork, so this could not work there in any case.
  live:
    name: Live smoke tests
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    environment: live-smoke
    defaults:
      run:
        working-directory: sdks/packages/node
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-package
        with:
          path: sdks/packages/node
      - run: npm run test:live
        env:
          TURBOSMTP_CONSUMER_KEY: ${{ secrets.TURBOSMTP_CONSUMER_KEY }}
          TURBOSMTP_CONSUMER_SECRET: ${{ secrets.TURBOSMTP_CONSUMER_SECRET }}
          TURBOSMTP_TEST_FROM: ${{ vars.TURBOSMTP_TEST_FROM }}
          TURBOSMTP_TEST_TO: ${{ vars.TURBOSMTP_TEST_TO }}
