name: Deploy Swagger UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'api-reference/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swagger UI
        run: |
          mkdir -p _swagger-ui
          curl -sL https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js -o _swagger-ui/swagger-ui-bundle.js
          curl -sL https://unpkg.com/swagger-ui-dist/swagger-ui.css -o _swagger-ui/swagger-ui.css

      # TODO: Update the spec file path once the OpenAPI 3.1 spec is committed
      - name: Copy OpenAPI spec
        run: cp api-reference/openapi.yaml _swagger-ui/openapi.yaml

      - name: Generate Swagger UI index
        run: |
          cat > _swagger-ui/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>TurboSMTP API Reference</title>
            <link rel="stylesheet" href="swagger-ui.css">
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="swagger-ui-bundle.js"></script>
            <script>
              SwaggerUIBundle({
                url: "openapi.yaml",
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
                layout: "StandaloneLayout"
              });
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _swagger-ui

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
