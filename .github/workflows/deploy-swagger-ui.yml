name: Deploy Swagger UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'api-reference/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # api-reference/ is a complete, self-contained Swagger UI bundle
      # (branded UI + a single pre-bundled spec: upstream/turbo-smtp.yaml,
      # produced by `redocly bundle` upstream — no Domains/ split), synced from
      # ../turbo-smtp-openapi/turbo-api-2/. Publish it verbatim — relative
      # asset paths resolve at the Pages site root.
      #
      # "Verbatim" is the point: the served spec is the untouched synced copy.
      # api-reference/overlays/ rides along unused — overlays apply only during
      # SDK generation and must never reach the published contract.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: api-reference

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
