name: Split packages to publish mirrors

# Publishing topology — one development repository, one read-only mirror per package.
#
# developers-hub is the only repo anyone commits to. A release tag pushes that one
# package's subtree to its read-only mirror, which is what npm / pkg.go.dev / Packagist
# link to and (for Go and PHP) actually consume.
#
# Tag convention:  <package>/vX.Y.Z  here  ->  vX.Y.Z  on the mirror.
# The prefix is a package slug, not a language. A language ships two API packages — a mail
# package and a unified one — so a slug names a package and never a language on its own.
# The mirror tag MUST be unprefixed: Go resolves versions from root-module tags, and
# Packagist reads composer.json from the repository root. That translation is the whole
# reason this workflow exists.
#
# A slug equals its directory's own name, but not its parent: API packages live under
# sdk-integrations/packages/ and webhook receivers under sdk-integrations/webhooks/. The `case` below is the one
# place that mapping is written down — adding a package means adding a line there and a
# tag glob above, not relying on a path convention.
#
# Requires a secret `MIRROR_TOKEN` — a PAT or GitHub App installation token with
# `contents: write` on every turbosmtp-* mirror the `case` below resolves to. A token
# scoped to fewer repos passes every check here and 403s on the final push.

on:
  push:
    tags:
      - 'node/v*'
      - 'node-mail/v*'
      - 'python/v*'
      - 'python-mail/v*'
      - 'csharp/v*'
      - 'csharp-mail/v*'
      - 'go/v*'
      - 'go-mail/v*'
      - 'php/v*'
      - 'php-mail/v*'
      - 'node-webhook/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing <package>/vX.Y.Z tag to (re-)split'
        required: true

# READ, not write — deliberately, even though this workflow pushes.
#
# The push goes to a *mirror* repository and authenticates with MIRROR_TOKEN, never with
# GITHUB_TOKEN. GITHUB_TOKEN is used for exactly one thing here: cloning this repository
# at the tag. Granting `contents: write` would buy nothing and would undo the protection
# that `persist-credentials: false` exists to provide — with credentials left in
# .git/config, a bad or empty MIRROR_TOKEN silently falls back to GITHUB_TOKEN, which is
# how a failed run once surfaced as an opaque 403 (see the checkout step). Read-only means
# that fallback cannot write anywhere even if the guard is removed.
permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      # Fail in seconds on a missing secret rather than after the split, and never
      # print the value — only its length, which is enough to tell empty from set.
      - name: Verify MIRROR_TOKEN is present
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::error::MIRROR_TOKEN is empty or unset. Set it under developers-hub → Settings → Secrets and variables → Actions. Note that a non-interactive \`gh secret set\` can store an empty value."
            exit 1
          fi
          echo "MIRROR_TOKEN present (${#MIRROR_TOKEN} chars)"

      - uses: actions/checkout@v4
        with:
          # `git subtree split` replays the directory's whole history — a shallow
          # clone silently produces a truncated mirror.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Do NOT leave GITHUB_TOKEN credentials in .git/config. Otherwise a bad or
          # empty MIRROR_TOKEN falls back to them silently and the push fails as an
          # opaque "denied to github-actions[bot]" 403 instead of an auth error —
          # observed on run 31105171893.
          persist-credentials: false

      # Every value below reaches the shell through `env:`, never through `${{ }}`
      # inside `run:`. An expression is expanded while the script is rendered, so an
      # attacker-supplied dispatch input would arrive as shell *source* and run before
      # the case statement could reject it (issue #6). Quoted variables are data.
      - name: Resolve package, version and mirror from the tag
        id: target
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          pkg="${tag%%/*}"
          version="${tag#*/}"
          # This case is the authoritative slug -> (mirror, directory) map. The prefix is
          # listed per slug rather than derived as sdk-integrations/packages/$pkg, because the webhook
          # receivers live under sdk-integrations/webhooks/. A derived path would silently resolve to a
          # directory that does not exist, and the check below would report it as a bad slug
          # rather than a stale mapping.
          case "$pkg" in
            node)         mirror=turbosmtp-node;         prefix=sdk-integrations/packages/node ;;
            node-mail)    mirror=turbosmtp-node-mail;    prefix=sdk-integrations/packages/node-mail ;;
            python)       mirror=turbosmtp-python;       prefix=sdk-integrations/packages/python ;;
            python-mail)  mirror=turbosmtp-python-mail;  prefix=sdk-integrations/packages/python-mail ;;
            csharp)       mirror=turbosmtp-dotnet;       prefix=sdk-integrations/packages/csharp ;;
            csharp-mail)  mirror=turbosmtp-dotnet-mail;  prefix=sdk-integrations/packages/csharp-mail ;;
            go)           mirror=turbosmtp-go;           prefix=sdk-integrations/packages/go ;;
            go-mail)      mirror=turbosmtp-go-mail;      prefix=sdk-integrations/packages/go-mail ;;
            php)          mirror=turbosmtp-php;          prefix=sdk-integrations/packages/php ;;
            php-mail)     mirror=turbosmtp-php-mail;     prefix=sdk-integrations/packages/php-mail ;;
            node-webhook) mirror=turbosmtp-node-webhook; prefix=sdk-integrations/webhooks/node-webhook ;;
            *) echo "::error::Unrecognised package prefix '$pkg' in tag '$tag'"; exit 1 ;;
          esac
          if [ "$version" = "$tag" ]; then
            echo "::error::Tag '$tag' is not in <package>/vX.Y.Z form"; exit 1
          fi
          # The case statement constrains pkg, but version is whatever followed the
          # slash and is pushed as a ref name, so it needs its own gate.
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$version' in tag '$tag' is not vX.Y.Z"; exit 1
          fi
          {
            echo "pkg=$pkg"
            echo "version=$version"
            echo "mirror=$mirror"
            echo "prefix=$prefix"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the package directory exists
        env:
          PREFIX: ${{ steps.target.outputs.prefix }}
          PKG: ${{ steps.target.outputs.pkg }}
        run: |
          if [ ! -d "$PREFIX" ]; then
            echo "::error::No package directory at '$PREFIX' for slug '$PKG'. The slug must equal the directory's own name, and the case block in this workflow must map it to the right parent (sdk-integrations/packages/ or sdk-integrations/webhooks/)."; exit 1
          fi

      - name: Split the package subtree
        id: split
        env:
          PREFIX: ${{ steps.target.outputs.prefix }}
        run: |
          set -euo pipefail
          sha="$(git subtree split --prefix="$PREFIX")"
          echo "Split $PREFIX -> $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Push subtree and translated tag to the mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          MIRROR: ${{ steps.target.outputs.mirror }}
          PKG: ${{ steps.target.outputs.pkg }}
          VERSION: ${{ steps.target.outputs.version }}
          SHA: ${{ steps.split.outputs.sha }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/${OWNER}/${MIRROR}.git"
          git push --force "$remote" "${SHA}:refs/heads/main"
          git push --force "$remote" "${SHA}:refs/tags/${VERSION}"
          echo "Mirrored $PKG as ${MIRROR}@${VERSION}"
