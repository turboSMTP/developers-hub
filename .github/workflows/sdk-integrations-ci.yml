name: SDKs CI

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Also run the live smoke tests (sends real email)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'sdk-integrations/**'
      - 'biome.json'
      - '.github/workflows/sdk-integrations-ci.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'sdk-integrations/**'
      - 'biome.json'
      - '.github/workflows/sdk-integrations-ci.yml'
      - '.github/actions/**'

# Least privilege for every job below; composite actions inherit this scope.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/biome-check

  # Node 22 (consumer floor per engines) and 24 (current LTS). Tests the source tree only;
  # the artifact-based consumer-floor check is separate and not automated.
  test:
    name: Test ${{ matrix.package.name }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The path is carried per package rather than derived from the name: unified SDKs
        # live under sdk-integrations/packages/ and webhook receivers under sdk-integrations/webhooks/.
        package:
          - { name: node-mail, path: sdk-integrations/packages/node-mail }
          - { name: node-webhook, path: sdk-integrations/webhooks/node-webhook }
        node: [22, 24]
    defaults:
      run:
        working-directory: ${{ matrix.package.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-package
        with:
          path: ${{ matrix.package.path }}
          node-version: ${{ matrix.node }}
      # The gates themselves stay in the workflow rather than moving into the action:
      # what blocks a merge should be readable without opening a second file.
      - run: npm run typecheck
      - run: npm test

  examples:
    name: Typecheck examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-integrations/packages/node-mail
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-package
        with:
          path: sdk-integrations/packages/node-mail
      - run: npm run typecheck:examples

  # Sends real email, so it never runs automatically.
  live:
    name: Live smoke tests
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    environment: live-smoke
    defaults:
      run:
        working-directory: sdk-integrations/packages/node-mail
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sdk-package
        with:
          path: sdk-integrations/packages/node-mail
      - run: npm run test:live
        env:
          TURBOSMTP_CONSUMER_KEY: ${{ secrets.TURBOSMTP_CONSUMER_KEY }}
          TURBOSMTP_CONSUMER_SECRET: ${{ secrets.TURBOSMTP_CONSUMER_SECRET }}
          TURBOSMTP_TEST_FROM: ${{ vars.TURBOSMTP_TEST_FROM }}
          TURBOSMTP_TEST_TO: ${{ vars.TURBOSMTP_TEST_TO }}
