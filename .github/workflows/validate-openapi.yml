name: Validate OpenAPI Specification

on:
  push:
    paths:
      - 'api-reference/**'
  pull_request:
    paths:
      - 'api-reference/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenAPI validator
        run: npm install -g @openapitools/openapi-generator-cli

      # TODO: Update the spec file path once the OpenAPI 3.1 spec is committed
      - name: Validate OpenAPI spec
        run: |
          openapi-generator-cli validate -i api-reference/openapi.yaml
