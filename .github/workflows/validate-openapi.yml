name: Validate OpenAPI Specification

on:
  push:
    paths:
      - 'api-integrations/upstream/**'
      - 'api-integrations/overlays/**'
      - 'sdk-integrations/scripts/check-spec.mjs'
      - '.github/workflows/validate-openapi.yml'
  pull_request:
    paths:
      - 'api-integrations/upstream/**'
      - 'api-integrations/overlays/**'
      - 'sdk-integrations/scripts/check-spec.mjs'
      - '.github/workflows/validate-openapi.yml'

# Read-only: this workflow checks out the repository, lints the spec and runs the
# drift guard. It writes nothing and needs no other scope.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate OpenAPI spec
        run: npx @redocly/cli@2.47.0 lint api-integrations/upstream/turbo-smtp.yaml

      # Runs after the lint so an invalid spec fails on the clearer error first.
      - name: Spec-drift guard
        run: node sdk-integrations/scripts/check-spec.mjs
