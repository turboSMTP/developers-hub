name: Biome lint and format gate
description: >-
  Run Biome in CI mode over the SDK tree. Self-contained — it installs its own Node — so
  that any workflow needing the lint gate gets the pinned version by construction rather
  than by remembering to copy the command.

inputs:
  scope:
    description: Path Biome checks. The default matches biome.json's own include scope.
    required: false
    default: sdks

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Pinned exactly, not floated: this is a merge gate, and a Biome minor adding a rule
    # to `recommended` would redden pull requests that never touched the files it fails
    # on (ADR-0004 rules 1-3). Keep in step with biome.json's $schema.
    #
    # The version lives here and nowhere else in .github/. A second workflow that needs
    # linting calls this action; it does not paste the command.
    - run: npx --yes @biomejs/biome@2.5.4 ci ${{ inputs.scope }}
      shell: bash
